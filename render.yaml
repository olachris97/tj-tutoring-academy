services:
  - type: web
    name: tj-tutoring-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && exec gunicorn --workers 1 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tj-tutoring-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: text
      - key: CORS_ORIGINS
        value: https://tjtutoring.academy,https://www.tjtutoring.academy
      - key: NOTIFY_EMAIL
        value: hello@tjtutoring.academy

databases:
  - name: tj-tutoring-db
    plan: free
    databaseName: tjtutoring
    user: tjtutoring
    
