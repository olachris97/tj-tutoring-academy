<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — TJ Tutoring Academy</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand"><span class="stamp">TJ</span>TJ Tutoring Academy</div>
    <p class="sub">Staff &amp; admin sign in</p>

    <div id="formAlert" class="form-alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="admin@tjtutoringacademy.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
    </form>

    <p class="auth-hint">Demo login: <code>admin@tjtutoringacademy.com</code> / <code>admin12345</code></p>
  </div>
</div>

<script>window.TJ_API_BASE = window.TJ_API_BASE || 'https://tj-tutoring-api.onrender.com';</script>
<script src="api.js"></script>
<script>
  // Already signed in? Skip straight to the dashboard.
  if (localStorage.getItem('tj_access_token') && localStorage.getItem('tj_refresh_token')) {
    location.href = 'dashboard.html';
  }

  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('formAlert');
  const submitBtn = document.getElementById('submitBtn');

  function showAlert(text) {
    alertBox.textContent = text;
    alertBox.className = 'form-alert show error';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.className = 'form-alert';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    try {
      const res = await fetch(API_BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: form.email.value.trim(), password: form.password.value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data.error && data.error.message) || 'Sign in failed.');

      TokenStore.access = data.access_token;
      TokenStore.refresh = data.refresh_token;
      TokenStore.admin = data.admin;
      location.href = 'dashboard.html';
    } catch (err) {
      showAlert(err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
